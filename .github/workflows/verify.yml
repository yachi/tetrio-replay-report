name: verify

# The repo's whole claim is that the numbers in the reports are machine-checked.
# This workflow re-establishes that on every push: it does not trust a single
# committed artefact, it re-runs the extractors, the claim predicates, the Dafny
# verifier, the codegen consistency check and (nightly) the mutation test.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, with mutation testing enabled
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Run the mutation test (slow)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DAFNY_VERSION: 4.11.0
  # sha256 of dafny-4.11.0-x64-ubuntu-22.04.zip, from the signed release listing
  DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
  CVC5_VERSION: 1.3.4
  # sha256 of cvc5-Linux-x86_64-static.zip. Two independent authorities agree on
  # this: cvc5's own Homebrew cask (cvc5/homebrew-cvc5) and GitHub's asset digest.
  CVC5_SHA256: dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6
  # Newest z3 still shipping a glibc-2.35 build (ubuntu-22.04's). See the install
  # step for why the lemma-vacuity gate needs z3 specifically, and why this pin is
  # weaker than the cvc5 one above.
  Z3_VERSION: 4.14.1
  Z3_SHA256: 76f797c849ae1487ce08840321d3334720434e0eb1a23e1bd755c3818ffb7265

jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        artefact:
          - sessions/2026-07-22/report
          - sessions/2026-07-24/report
          - sessions/2026-07-24/proof
          - sessions/2026-07-28/report
          - sessions/2026-08-01/report
          - sessions/2026-08-09/report
          - sessions/2026-08-14/report
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Dafny ${{ env.DAFNY_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fsSL "$URL" -o dafny.zip
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$HOME/dafny-dist"
          echo "$HOME/dafny-dist/dafny" >> "$GITHUB_PATH"

      # verify-session step 7 (lemma vacuity) needs an SMT solver, and it FAILS
      # rather than skips when there is none — a gate that quietly does nothing
      # when its dependency is absent reports success for work it never did.
      # That is the right behaviour, and it is why this job went red: the step
      # was moved from MUTATION-gated to always-on once it got fast enough, and
      # this job installed only Dafny.
      #
      # It must be z3, not the cvc5 the SMT job below installs. Measured on this
      # checker's queries: z3 settles 2026-07-24's 78 claims in 2.6 s, while cvc5
      # produced no result at all in 120 s and did not finish 2026-07-22 in ten
      # minutes. Installing cvc5 here would have turned a red job into a hanging
      # one. The free-variable queries this gate asks are simply not cvc5's
      # ground, and the two solvers are not interchangeable for it.
      #
      # 4.14.1 is the NEWEST z3 release still shipping a glibc-2.35 build, which
      # is what ubuntu-22.04 has; every release after it is glibc-2.39 only, the
      # constraint the SMT job's comment records.
      #
      # WEAKER PIN THAN THE cvc5 ONE BELOW, deliberately, and here is the search
      # that settled it (2026-08-02) so nobody has to repeat it:
      #
      #   - GitHub asset `digest`: null for EVERY z3 release that ships a
      #     glibc-2.35 build (checked 4.13.4, 4.14.1). Every release that DOES
      #     publish a digest (4.15.3, 4.15.8, 4.16.0) ships glibc-2.39 only.
      #     The two properties are disjoint across the whole release history.
      #   - `gh attestation verify`: HTTP 404, no SLSA provenance for this asset.
      #   - The release carries no checksum, signature or SBOM asset — its only
      #     non-archive files are Microsoft.Z3 nupkgs, a different artifact.
      #   - nixpkgs builds z3 from source (`fetchFromGitHub` on a rev), as does
      #     its F* z3 pin, so neither is an authority for this binary zip.
      #
      # So the sha256 below is trust-on-first-use: computed from a download whose
      # byte length matches the API's (51650111). It defends against the asset
      # changing from here on, not against it having been wrong when first
      # fetched.
      #
      # The one way to reach a two-authority pin is ubuntu-24.04 + z3 4.16.0,
      # whose digest GitHub publishes. NOT taken: that would move the OS under
      # the Dafny proof run to strengthen a helper tool's provenance, and the
      # verification result is the thing this repo exists to protect. Revisit if
      # the job moves to 24.04 for its own reasons, or if Z3Prover starts
      # publishing digests for the builds this runner can execute.
      - name: Install z3 ${{ env.Z3_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.35.zip"
          curl -fsSL "$URL" -o z3.zip
          echo "${Z3_SHA256}  z3.zip" | sha256sum -c -
          unzip -q z3.zip -d "$HOME/z3-dist"
          mkdir -p "$HOME/bin"
          cp "$HOME/z3-dist/z3-${Z3_VERSION}-x64-glibc-2.35/bin/z3" "$HOME/bin/z3"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          dafny --version
          z3 --version
          python3 --version
          jq --version

      - name: Verify ${{ matrix.artefact }}
        env:
          MUTATION: ${{ (github.event_name == 'schedule' || inputs.mutation) && '1' || '0' }}
        run: bin/verify-session "${{ matrix.artefact }}"

      # A badge links a claim to its lemma through the proof map, and codegen
      # derives lemma names from each claim's gloss — so editing a gloss can
      # strand the link while the verifier still reports 0 errors.
      - name: Check every proof link names a lemma that exists
        run: python3 -m pipeline.check_proof_links "${{ matrix.artefact }}"

      # A const no lemma reads cannot be killed by a mutation, so it inflates the
      # dataset the proofs appear to pin down. 157 dead ones shipped for weeks.
      #
      # --selftest first: this gate decides membership by tokenising the lemma text once
      # rather than running a regex per const, and a tokeniser that is too generous prints
      # exactly what a clean run prints. The planted cases include the prefix/suffix
      # substrings that a naive containment test would wave through.
      - name: Check no Dafny constant is dead (and that the gate can fail)
        run: |
          set -euo pipefail
          python3 -m pipeline.check_dead_consts --selftest
          python3 -m pipeline.check_dead_consts "${{ matrix.artefact }}"

      # The APM/VS records exclude short rounds (generators.QUALIFYING_MS), which
      # frees those rounds' rate constants from the record's upper bound. The
      # random mutation sample caught that hole once, by luck; this walks the whole
      # class deterministically. Skipped for the 07-24 proof/ artefact, which has
      # no rate-record family.
      - name: Check short rounds' rate constants are still pinned
        run: |
          if [ -f "${{ matrix.artefact }}/claims-generated.json" ]; then
            python3 -m pipeline.check_rate_coverage "${{ matrix.artefact }}"
          else
            echo "  --  ${{ matrix.artefact }} has no generated ledger"
          fi

      # check_rate_coverage and claims/equiv.py perturb facts IN PLACE and undo, instead of
      # deep-copying the tree per mutant. deepcopy could not corrupt the original; make/unmake
      # can, and would do it silently — a sweep that misses one restore judges everything
      # after it against a raised constant, which makes the gate MORE likely to pass. Both
      # callers fingerprint the tree either side of their sweep; this plants a broken restore
      # and requires that fingerprint to catch it.
      - name: Check the in-place perturbation always restores (and that the guard can fail)
        run: bash pipeline/test_perturb.sh "${{ matrix.artefact }}"

  # The generator pipeline: regenerate each session's ledger from facts.json, check it
  # is byte-identical to what is committed, then generate and verify its Dafny. This is
  # what keeps "a new session is one command" true rather than aspirational.
  pipeline:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        session: ['2026-07-22', '2026-07-24', '2026-07-28', '2026-08-01', '2026-08-09',
                  '2026-08-14']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Dafny ${{ env.DAFNY_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fsSL "$URL" -o dafny.zip
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$HOME/dafny-dist"
          echo "$HOME/dafny-dist/dafny" >> "$GITHUB_PATH"

      - name: Regenerate the ledger and compare with the committed one
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          before=$(sha256sum "$W/claims-generated.json" | cut -d' ' -f1)
          python3 -m pipeline.claims.build_claims "$W/facts.json" --out "$W/claims-generated.json"
          after=$(sha256sum "$W/claims-generated.json" | cut -d' ' -f1)
          [ "$before" = "$after" ] || {
            echo "FAIL: regenerating the ledger changed it — commit the new one" >&2
            exit 1
          }
          echo "  ok  generated ledger reproduces byte-for-byte"

      # A session whose hand claims carry specs builds them from hand_claims.py the
      # same way, so the committed ledger cannot drift from the module either. The
      # older sessions have no such module and are skipped by the guard, not silently.
      - name: Regenerate the hand ledger and compare with the committed one
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          if [ ! -f "$W/hand_claims.py" ]; then
            echo "  --  $W has no hand_claims.py (its hand claims predate the spec algebra)"
            exit 0
          fi
          before=$(sha256sum "$W/claims-narrative.json" | cut -d' ' -f1)
          python3 -m pipeline.claims.build_hand "$W/hand_claims.py" \
            --facts "$W/facts.json" --out "$W/claims-narrative.json"
          after=$(sha256sum "$W/claims-narrative.json" | cut -d' ' -f1)
          [ "$before" = "$after" ] || {
            echo "FAIL: regenerating the hand ledger changed it — commit the new one" >&2
            exit 1
          }
          echo "  ok  hand ledger reproduces byte-for-byte"

      # The charts read a JSON island. It used to be hand-written, so a chart could
      # disagree with facts.json and nothing would catch it — this makes that a
      # build failure instead.
      # --selftest first, because --check on its own cannot see either of the two ways a
      # generated section goes quietly stale: a builder that stops producing its section
      # leaves the committed region untouched (so the document is unchanged and --check
      # reports agreement), and a claim-reading section that no longer understands a
      # claim's spec drops a row from a table that still looks complete. Each guard gets
      # a planted defect here and must reject it.
      - name: Regenerate the report's derived sections and compare with the committed report
        run: |
          set -euo pipefail
          python3 -m pipeline.build_report "sessions/${{ matrix.session }}/report" --selftest
          python3 -m pipeline.build_report "sessions/${{ matrix.session }}/report" --check

      # 約 has to mean the floored value everywhere. The generators floor by
      # construction; hand-written Cantonese and glosses are where a rounded
      # figure gets in, and 約262.6 vs 約262.5 for one integer shipped for weeks.
      - name: Check every 約-figure in hand-written text is floored
        run: python3 -m pipeline.check_prose_figures "sessions/${{ matrix.session }}/report"

      # A generated section's <style> is injected into the body, so at equal
      # specificity it beats the report's own stylesheet. 全場之最 defining
      # .rec-grid silently collapsed 建議's two columns; nothing failed.
      - name: Check no generated CSS reaches outside its region
        run: python3 -m pipeline.check_generated_css "sessions/${{ matrix.session }}/report"

      # An unresolved badge is indistinguishable from a pending one: it renders
      # ⏳ G014 pointing at an anchor that does not exist. Both ways that has
      # happened are checked — a cited id the island does not carry, and
      # shorthand the page's own expander regex fails to match (07-28 shipped
      # `[CR]\d{3}`, so every <b>G0xx</b> in match copy stayed literal text and
      # only a screenshot caught it).
      - name: Check every badge citation resolves
        run: python3 -m pipeline.check_badge_links "sessions/${{ matrix.session }}/report"

      # The report body is generated from prose files into marker regions; the
      # shell is all that is left in the HTML. This scans the DOCUMENT for
      # sections rather than reading build_report.SECTIONS — the claim "the body
      # is fully generated" was once written down while <section id="matches">
      # sat there hand-written, because it was checked the other way.
      - name: Check no hand-written section survives in the body
        run: python3 -m pipeline.check_report_shell "sessions/${{ matrix.session }}/report"

      # The forecast section is simulator-derived and sits OUTSIDE the proof
      # chain, so no lemma covers its numbers. This RE-RENDERS the region from
      # sim/forecast-facts.json and requires the committed HTML to match it
      # exactly, and fails if the section ever stops declaring itself unproved
      # or acquires a claim badge. It also fails if a session with no simulator
      # output somehow grew the section — that bug shipped once, grafting one
      # session's numbers into another session's report.
      #
      # --selftest plants a foreign figure into the committed pair and requires
      # the gate to reject it. The gate's previous form checked only that each
      # JSON figure APPEARED in the HTML, which passes just as happily when the
      # section also contains a figure that came from nowhere — and every
      # statistic in the method note was exactly that. A gate whose failure has
      # never been demonstrated is not evidence of anything.
      - name: Check the simulator-derived forecast section
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          python3 -m pipeline.check_forecast_section "$W"
          if [ -f "sessions/${{ matrix.session }}/sim/forecast-facts.json" ]; then
            python3 -m pipeline.check_forecast_section "$W" --selftest
          fi

      # harddrop's own opener drawings, which the named-opener table compares
      # against. Session-independent (it checks one committed file against the
      # catalogue), so the session matrix re-runs it identically five times —
      # kept here rather than split into a job of its own because it is offline
      # and finishes in well under a second.
      # Offline: it re-verifies the committed transcription's internal
      # consistency and — where opener_db draws the same opener — that the two
      # independently maintained sources agree cell for cell. --selftest plants
      # the four defects it claims to catch, including a flipped cell on an
      # opener BOTH sources draw, which is the mutant that proves the
      # dual-source check rather than the shape checks.
      - name: Check the harddrop wiki opener transcription
        run: |
          set -euo pipefail
          python3 -m pipeline.openers.extract_wiki_openers
          python3 -m pipeline.openers.extract_wiki_openers --selftest

      # The Donation / STMB Cave drawings, which are the INSTRUMENT CONTROLS for
      # the section's fifth and sixth tables: openers.test.ts feeds these very
      # boards through the shipped predicates and requires every positive to fire
      # and every negative to be rejected. A transcription that quietly lost its
      # positives would turn those control tests into vacuous passes over an empty
      # array, so the count assertions live in the test and the board-level checks
      # live here. --selftest plants every defect verify() claims to catch,
      # including a cave narrowed to 2 wide and Sky Prop dropped from the class.
      - name: Check the harddrop wiki T-spin technique transcription
        run: |
          set -euo pipefail
          python3 -m pipeline.openers.extract_wiki_techniques
          python3 -m pipeline.openers.extract_wiki_techniques --selftest

      # The C-Spin / DT-Cannon section, same quarantine and the same re-render
      # gate. It carries one extra invariant of its own: the slot-geometry share
      # (~9 in 10 Triples match the wiki window, ~1 in 10 Doubles) may not be
      # published without the Doubles comparison beside it. Keeping the share and
      # dropping the control turns a shape test into "89% of these were C-Spins",
      # which is the misreading the cross-tab exists to prevent — so the control
      # sentence is checked for, and --selftest deletes it to prove the check bites.
      - name: Check the simulator-derived C-Spin / DT Cannon section
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          python3 -m pipeline.check_opener_section "$W"
          if [ -f "sessions/${{ matrix.session }}/sim/opener-facts.json" ]; then
            python3 -m pipeline.check_opener_section "$W" --selftest
          fi

      - name: Generate and verify the Dafny proofs
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          LEDGERS=$(python3 -c "import sys;from pipeline.codegen import partition_spec_ledgers,session_ledgers;print(' '.join(partition_spec_ledgers(session_ledgers(sys.argv[1]))[0]))" "$W")
          echo "ledgers: $LEDGERS"
          python3 -m pipeline.codegen "$W/facts.json" \
            --claims $LEDGERS --outdir "$RUNNER_TEMP/dfy"
          out=$(dafny verify "$RUNNER_TEMP/dfy/Facts.dfy" "$RUNNER_TEMP/dfy/Claims.dfy" --cores 4 2>&1 | tail -1)
          echo "$out"
          case "$out" in *"0 errors"*) ;; *) exit 1 ;; esac

      # The generated ledger's lemmas are not committed, so its proof map can only
      # be checked against the directory they were just generated into.
      - name: Check the generated proof map's links resolve
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          if [ ! -f "$W/claims-generated-proof-map.json" ]; then
            echo "  --  $W has one map covering every ledger; the verify job checks it"
            exit 0
          fi
          python3 -m pipeline.check_proof_links "$W" \
            --map claims-generated-proof-map.json --dafny-dir "$RUNNER_TEMP/dfy"

      - name: Mutation-test the generated proofs
        if: github.event_name == 'schedule' || inputs.mutation
        run: bash pipeline/mutation_test.sh "$RUNNER_TEMP/dfy" 12

      # cvc5 is the SECOND solver: independently implemented from Z3, checking the
      # same committed .smt2. Pinned by sha256 — the same hash cvc5's own Homebrew
      # cask carries and GitHub's asset digest reports, which agree with each other.
      # (Recent z3 releases only ship glibc-2.39 builds, which will not run on this
      # runner, so z3 is the local solver and cvc5 the CI one.)
      - name: Install cvc5 ${{ env.CVC5_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
          curl -fsSL "$URL" -o cvc5.zip
          echo "${CVC5_SHA256}  cvc5.zip" | sha256sum -c -
          unzip -q cvc5.zip -d "$HOME/cvc5-dist"
          mkdir -p "$HOME/bin"
          cp "$HOME/cvc5-dist/cvc5-Linux-x86_64-static/bin/cvc5" "$HOME/bin/cvc5"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cvc5" --version | head -1

      # The same claims, rendered to SMT-LIB from the same specs and checked by a
      # solver directly. Runs in well under a second, so the anti-vacuity mutation
      # test runs on every push here rather than weekly like the Dafny one.
      # 96, not a token dozen: the sample is stratified so this covers all 32 kinds
      # of datum, and a 12-constant sample is what let two operator bugs through.
      # Costs ~5s.
      - name: Check the SMT-LIB artefact (regenerates, then solves and mutates)
        run: |
          python3 -m pipeline.check_smt "sessions/${{ matrix.session }}/report" \
            --regen --mutate 96

  # The second extractor is a genuinely independent implementation; re-running it
  # is what makes the "two parsers agree" claim mean something.
  cross-extractor:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: '1.2.4'

      - name: Re-run the TypeScript extractor and compare against committed output
        run: |
          set -euo pipefail
          status=0
          for d in sessions/2026-07-22/report sessions/2026-07-24/report sessions/2026-07-24/proof sessions/2026-07-28/report sessions/2026-08-01/report sessions/2026-08-09/report sessions/2026-08-14/report; do
            ts=$(ls "$d"/extract2*.ts | head -1)
            f2=$(ls "$d"/facts2*.json | head -1)
            before=$(sha256sum "$f2" | cut -d' ' -f1)
            ( cd "$d" && bun "$(basename "$ts")" >/dev/null )
            after=$(sha256sum "$f2" | cut -d' ' -f1)
            if [ "$before" = "$after" ]; then
              echo "  ok  $d — $(basename "$ts") reproduces $(basename "$f2")"
            else
              echo "FAIL  $d — $(basename "$ts") no longer reproduces $(basename "$f2")" >&2
              status=1
            fi
          done
          exit $status

      # The step above only proves extractor B is deterministic. The repo's actual claim is that
      # TWO INDEPENDENT extractors agree — and nothing here checked that. `bin/new-session` diffs
      # A against B once, when a session is created, and never again; a later edit to either
      # extractor could drift them apart and every gate would stay green. The reports say in prose
      # that their figures are twice-derived, so this is the step that makes that sentence true
      # rather than historical.
      - name: Compare extractor A against extractor B
        run: |
          set -euo pipefail
          status=0
          for d in sessions/2026-07-22/report sessions/2026-07-24/report sessions/2026-07-24/proof sessions/2026-07-28/report sessions/2026-08-01/report sessions/2026-08-09/report sessions/2026-08-14/report; do
            # Globbed, not `ls`-ed: under `set -o pipefail` an `ls` with one non-matching operand
            # fails the whole assignment and the step exits before printing anything.
            f1=""; for f in "$d"/facts.json "$d"/facts-*.json; do [ -f "$f" ] && { f1="$f"; break; }; done
            f2=""; for f in "$d"/facts2.json "$d"/facts2-*.json; do [ -f "$f" ] && { f2="$f"; break; }; done
            if [ -z "$f1" ] || [ -z "$f2" ]; then
              echo "FAIL  $d — missing a facts pair (A='$f1' B='$f2')" >&2; status=1; continue
            fi
            if diff <(jq -S . "$f1") <(jq -S . "$f2") >/dev/null; then
              echo "  ok  $d — $(basename "$f1") and $(basename "$f2") agree"
            else
              echo "FAIL  $d — the two extractors disagree:" >&2
              diff <(jq -S . "$f1") <(jq -S . "$f2") | head -40 >&2
              status=1
            fi
          done
          exit $status

  # docs/ is the published GitHub Pages site, copied from the sessions by
  # bin/build-docs — and nothing reran it automatically. Every other gate here
  # verifies sessions/, so a report could pass all of them while the page people
  # actually load stayed stale. That happened: a whole section (T-Spin Forecast)
  # was live in sessions/ and absent from docs/ until someone noticed by hand.
  docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check docs/ was republished from the sessions
        run: python3 bin/build-docs --check

  # The simulator's own test suite ran nowhere. `cross-extractor` above is the only job that
  # touches Bun and it only re-runs the extractors, so every assertion about the T-Spin Forecast
  # metric — the corpus census, the wiki fixtures, the clause-2 verdicts — was verified on
  # someone's laptop and nowhere else. The suite takes under four seconds.
  #
  # The import gate is the other half of the same hole. `forecast.test.ts` imported a name that no
  # file exported, for weeks, green the whole time: Bun does not validate named exports, there is
  # no tsc step, and the tests were not run here. See pipeline/check_ts_imports.py.
  typescript:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: '1.2.4'

      - name: Check every named import resolves to an export (and that the gate can fail)
        run: |
          set -euo pipefail
          python3 -m pipeline.check_ts_imports --selftest
          python3 -m pipeline.check_ts_imports

      - name: Check every forecast count routes through isVerifiedForecast (and that the gate can fail)
        run: |
          set -euo pipefail
          python3 -m pipeline.check_forecast_numerator --selftest
          python3 -m pipeline.check_forecast_numerator

      # REPLAY_DIR has no default on purpose — the simulator is session-agnostic and refuses to
      # guess which replays you mean. One test reads it; the rest name their sessions themselves.
      - name: Run the simulator test suite
        run: REPLAY_DIR=sessions/2026-07-22 bun test

  # The HAND-WRITTEN spec. Distinct from the `verify` job, which checks the GENERATED per-session
  # claims (Facts.dfy / Claims.dfy) — that job installs Dafny and never touches spec/Forecast.dfy.
  # Until now nothing did: 109 proof obligations, a mutation suite and a vacuity gate all lived
  # outside CI and were green on one laptop. Everything below was already runnable; the omission
  # was that no job ran it.
  spec:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Dafny ${{ env.DAFNY_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fsSL "$URL" -o dafny.zip
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$HOME/dafny-dist"
          echo "$HOME/dafny-dist/dafny" >> "$GITHUB_PATH"

      # Read the OUTPUT, not the exit code. Dafny exits 4 on a TIMEOUT, and this repo has already
      # shipped one harness that scored a timeout as a pass by trusting `$?` — see the note in
      # spec/mutate-forecast-spec.sh. `0 errors` is the only thing that means verified.
      - name: Verify the spec
        run: |
          set -euo pipefail
          for f in spec/Forecast.dfy spec/ForecastExamples.dfy spec/BfsKey.dfy spec/DonationCave.dfy; do
            out=$(dafny verify "$f" 2>&1) || true
            echo "$out" | tail -1
            case "$out" in
              *", 0 errors"*) ;;
              *) echo "FAIL: $f did not verify" >&2; exit 1 ;;
            esac
          done

      # A lemma whose hypotheses are contradictory is green and says nothing. The gate carries a
      # poison and a healthy control and exits 2 if either misbehaves — a uniform verdict is the
      # signature of a broken harness, which this repo has also shipped once.
      # Each spec's controls are written in its OWN vocabulary, so the gate runs once per file and
      # refuses a module it has no controls for — a shared, module-agnostic control would still pass
      # with a broken `include`, which is half of what a control is for.
      - name: Check no lemma is vacuously true
        run: |
          python3 spec/check_spec_vacuity.py
          python3 spec/check_spec_vacuity.py spec/DonationCave.dfy

      # The seven worked examples are described twice — as the machine-checked witnesses above and
      # as the drawn boards in example-boards.ts. The Dafny verifier never reads the TS, and the TS
      # test only compared the roof/floor separation, so the two could disagree on the verdict of a
      # board and stay green. This parses both and fails on any mismatch (event, setup step, verdict
      # derived from the ensures, failing clause), then checks the committed JSON is byte-identical.
      - name: The drawn boards agree with the proven examples
        run: |
          python3 -m pipeline.forecast_examples --selftest
          python3 -m pipeline.forecast_examples

      # Slow (each mutant is a full re-verification), so it runs on the schedule and on demand,
      # matching how the `verify` job gates its own mutation testing.
      - name: Mutation-test the spec
        if: github.event_name == 'schedule' || inputs.mutation
        run: |
          bash spec/mutate-forecast-spec.sh
          bash spec/mutate-donationcave.sh

  # The cc-oracle container image, built the way the local Mac could not: on a native aarch64-linux
  # runner. No cross-compile (so no zstd-sys/libiconv snag), no linux-builder, no root — cc-oracle
  # compiles native and nix2container assembles the image in one `nix build`. This is the CI answer
  # to "package the detectors as a hermetic oracle": the image builds reproducibly, and the binary
  # inside it is exercised against a real corpus board.
  oracle-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix (flakes on by default)
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Build the OCI image (native aarch64-linux)
        run: nix build .#cc-oracle-image -L

      - name: The image's oracle detects a real T-slot and clears an empty board
        run: |
          set -euo pipefail
          nix build .#cc-oracle -L          # the aarch64-linux binary the image wraps
          empty=$(python3 -c "print(chr(10).join(['.'*10]*40))" | ./result/bin/cc-oracle)
          echo "empty board -> $empty"
          [ "$empty" = '{"any":false,"hits":[],"lines":0}' ] || { echo "negative control failed" >&2; exit 1; }
          tst=$(./result/bin/cc-oracle < nix/cold-clear-oracle/smoke-tst.txt)
          echo "corpus T-slot -> $tst"
          case "$tst" in *'"tst_twist_left"'*'"lines":3'*) ;; *) echo "positive control failed" >&2; exit 1 ;; esac
          echo "oracle smoke test passed"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: '1.2.4'

      # The count `bestTspinLines` produces IS what the forecast metric consumes, and it had no
      # outside check — only our own second BFS. This runs it against the Rust cutout_tslot over
      # every verified-prefix board of all four sessions: a miscount or a missed line-clearing slot
      # fails the job. (Measured clean: 1,831 slots, all counts agree, 0 missed.)
      - name: Every T-spin line count matches the Rust original across the corpus
        run: |
          set -euo pipefail
          for s in 2026-07-22 2026-07-24 2026-07-28 2026-08-01; do
            echo "-- $s"
            REPLAY_DIR="sessions/$s" bun pipeline/sim/cross-tslot-count.ts ./result/bin/cc-oracle
          done

      # cross-tslot-count checks ours against cold-clear's SINGLE best detector. This checks the
      # stronger thing multi-slot could threaten: the scalar the forecast metric consumes is never
      # below what cold-clear's MULTI-slot cutout chain finds on the same board (`CC_ORACLE_SLOTS=1`
      # makes the oracle emit the chain). It fails if multi-slot ever sees a bigger current-board
      # spin than the scalar — the case that would force re-opening the "don't wire multi-slot into
      # the metric" decision. Measured clean: 0 of 7,544 boards; multi-slot changes the path of
      # exclusion, not the value.
      - name: Multi-slot cutout never exceeds the scalar the metric consumes
        env:
          CC_ORACLE_SLOTS: '1'
        run: bun pipeline/sim/cross-tslot-multi.ts ./result/bin/cc-oracle

      # cross-tslot-count/-multi check the SLOT the metric consumes, not the SEARCH that reaches it —
      # the arrival-key defect (spec/BfsKey.dfy) was invisible to both. cross-movegen.test.ts is that
      # standing gate: our BFS reachable-placement set is a superset of the real find_moves for every
      # piece, over random boards AND every verified-prefix board of all five sessions. Without
      # CC_ORACLE set it skips silently (bun test has no nix), so it must run here where the binary
      # already exists. cross-srs-tables needs no oracle binary; it rides along since bun is already up.
      - name: Reachability (cross-movegen), kick tables (cross-srs-tables), T-spin rule (cross-tspin) vs cold-clear
        env:
          CC_ORACLE: ./result/bin/cc-oracle
        run: bun test pipeline/sim/cross-movegen.test.ts pipeline/sim/cross-srs-tables.test.ts pipeline/sim/cross-tspin.test.ts
