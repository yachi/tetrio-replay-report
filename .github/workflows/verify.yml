name: verify

# The repo's whole claim is that the numbers in the reports are machine-checked.
# This workflow re-establishes that on every push: it does not trust a single
# committed artefact, it re-runs the extractors, the claim predicates, the Dafny
# verifier, the codegen consistency check and (nightly) the mutation test.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, with mutation testing enabled
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Run the mutation test (slow)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DAFNY_VERSION: 4.11.0
  # sha256 of dafny-4.11.0-x64-ubuntu-22.04.zip, from the signed release listing
  DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179

jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        artefact:
          - sessions/2026-07-22/report
          - sessions/2026-07-24/report
          - sessions/2026-07-24/proof
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Dafny ${{ env.DAFNY_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fsSL "$URL" -o dafny.zip
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$HOME/dafny-dist"
          echo "$HOME/dafny-dist/dafny" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          dafny --version
          python3 --version
          jq --version

      - name: Verify ${{ matrix.artefact }}
        env:
          MUTATION: ${{ (github.event_name == 'schedule' || inputs.mutation) && '1' || '0' }}
        run: bin/verify-session "${{ matrix.artefact }}"

      # A badge links a claim to its lemma through the proof map, and codegen
      # derives lemma names from each claim's gloss — so editing a gloss can
      # strand the link while the verifier still reports 0 errors.
      - name: Check every proof link names a lemma that exists
        run: python3 -m pipeline.check_proof_links "${{ matrix.artefact }}"

      # A const no lemma reads cannot be killed by a mutation, so it inflates the
      # dataset the proofs appear to pin down. 157 dead ones shipped for weeks.
      - name: Check no Dafny constant is dead
        run: python3 -m pipeline.check_dead_consts "${{ matrix.artefact }}"

  # The generator pipeline: regenerate each session's ledger from facts.json, check it
  # is byte-identical to what is committed, then generate and verify its Dafny. This is
  # what keeps "a new session is one command" true rather than aspirational.
  pipeline:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        session: ['2026-07-22', '2026-07-24']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Dafny ${{ env.DAFNY_VERSION }} (pinned by sha256)
        run: |
          set -euo pipefail
          URL="https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -fsSL "$URL" -o dafny.zip
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$HOME/dafny-dist"
          echo "$HOME/dafny-dist/dafny" >> "$GITHUB_PATH"

      - name: Regenerate the ledger and compare with the committed one
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          before=$(sha256sum "$W/claims-generated.json" | cut -d' ' -f1)
          python3 -m pipeline.claims.build_claims "$W/facts.json" --out "$W/claims-generated.json"
          after=$(sha256sum "$W/claims-generated.json" | cut -d' ' -f1)
          [ "$before" = "$after" ] || {
            echo "FAIL: regenerating the ledger changed it — commit the new one" >&2
            exit 1
          }
          echo "  ok  generated ledger reproduces byte-for-byte"

      # The charts read a JSON island. It used to be hand-written, so a chart could
      # disagree with facts.json and nothing would catch it — this makes that a
      # build failure instead.
      - name: Regenerate the report's derived sections and compare with the committed report
        run: python3 -m pipeline.build_report "sessions/${{ matrix.session }}/report" --check

      # 約 has to mean the floored value everywhere. The generators floor by
      # construction; hand-written Cantonese and glosses are where a rounded
      # figure gets in, and 約262.6 vs 約262.5 for one integer shipped for weeks.
      - name: Check every 約-figure in hand-written text is floored
        run: python3 -m pipeline.check_prose_figures "sessions/${{ matrix.session }}/report"

      # A generated section's <style> is injected into the body, so at equal
      # specificity it beats the report's own stylesheet. 全場之最 defining
      # .rec-grid silently collapsed 建議's two columns; nothing failed.
      - name: Check no generated CSS reaches outside its region
        run: python3 -m pipeline.check_generated_css "sessions/${{ matrix.session }}/report"

      - name: Generate and verify the Dafny proofs
        run: |
          set -euo pipefail
          W="sessions/${{ matrix.session }}/report"
          python3 -m pipeline.codegen "$W/facts.json" \
            --claims "$W/claims-generated.json" --outdir "$RUNNER_TEMP/dfy"
          out=$(dafny verify "$RUNNER_TEMP/dfy/Facts.dfy" "$RUNNER_TEMP/dfy/Claims.dfy" --cores 4 2>&1 | tail -1)
          echo "$out"
          case "$out" in *"0 errors"*) ;; *) exit 1 ;; esac

      # The generated ledger's lemmas are not committed, so its proof map can only
      # be checked against the directory they were just generated into.
      - name: Check the generated proof map's links resolve
        run: |
          python3 -m pipeline.check_proof_links "sessions/${{ matrix.session }}/report" \
            --map claims-generated-proof-map.json --dafny-dir "$RUNNER_TEMP/dfy"

      - name: Mutation-test the generated proofs
        if: github.event_name == 'schedule' || inputs.mutation
        run: bash pipeline/mutation_test.sh "$RUNNER_TEMP/dfy" 12

      # Use the Z3 inside the Dafny release, which the sha256 above already pins —
      # rather than apt's, which would be an unpinned download. If the layout ever
      # changes this fails loudly instead of quietly falling back to an unpinned
      # solver.
      - name: Put Dafny's bundled Z3 on PATH
        run: |
          set -euo pipefail
          Z3="$(find "$HOME/dafny-dist" -type f -name 'z3*' -perm -u+x | head -1)"
          if [ -z "$Z3" ]; then
            echo "no z3 inside the pinned Dafny distribution; add a sha256-pinned" >&2
            echo "z3 release step rather than an unpinned package install" >&2
            find "$HOME/dafny-dist" -maxdepth 3 -type d | head -20 >&2
            exit 1
          fi
          mkdir -p "$HOME/bin" && ln -sf "$Z3" "$HOME/bin/z3"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/z3" --version

      # The same claims, rendered to SMT-LIB from the same specs and checked by a
      # solver directly. Runs in well under a second, so the anti-vacuity mutation
      # test runs on every push here rather than weekly like the Dafny one.
      - name: Check the SMT-LIB artefact (regenerates, then solves and mutates)
        run: |
          python3 -m pipeline.check_smt "sessions/${{ matrix.session }}/report" \
            --regen --mutate 12

  # The second extractor is a genuinely independent implementation; re-running it
  # is what makes the "two parsers agree" claim mean something.
  cross-extractor:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2.0.2
        with:
          bun-version: '1.2.4'

      - name: Re-run the TypeScript extractor and compare against committed output
        run: |
          set -euo pipefail
          status=0
          for d in sessions/2026-07-22/report sessions/2026-07-24/report sessions/2026-07-24/proof; do
            ts=$(ls "$d"/extract2*.ts | head -1)
            f2=$(ls "$d"/facts2*.json | head -1)
            before=$(sha256sum "$f2" | cut -d' ' -f1)
            ( cd "$d" && bun "$(basename "$ts")" >/dev/null )
            after=$(sha256sum "$f2" | cut -d' ' -f1)
            if [ "$before" = "$after" ]; then
              echo "  ok  $d — $(basename "$ts") reproduces $(basename "$f2")"
            else
              echo "FAIL  $d — $(basename "$ts") no longer reproduces $(basename "$f2")" >&2
              status=1
            fi
          done
          exit $status
