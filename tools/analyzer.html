<meta charset="utf-8" />
<title>TETR.IO Replay 分析器 — 即場戰報</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ============================= TOKENS ============================= */
  :root {
    --bg: #f5f6fa;
    --bg-raised: #ffffff;
    --bg-sunken: #eceef5;
    --ink: #12141c;
    --ink-secondary: #4b4f5e;
    --muted: #8a8fa3;
    --border: rgba(18, 20, 28, 0.10);
    --border-strong: rgba(18, 20, 28, 0.18);

    /* player-1 = teal, player-2 = violet (assigned by player order, not name) */
    --p1: #0e8f9e;
    --p1-tint: rgba(14, 143, 158, 0.10);
    --p1-tint-strong: rgba(14, 143, 158, 0.20);
    --p2: #7c3aed;
    --p2-tint: rgba(124, 58, 237, 0.10);
    --p2-tint-strong: rgba(124, 58, 237, 0.20);

    --good: #0ca30c;
    --good-tint: rgba(12, 163, 12, 0.12);
    --bad: #d03b3b;
    --bad-tint: rgba(208, 59, 59, 0.12);
    --pending: #c98500;
    --pending-tint: rgba(201, 133, 0, 0.12);
    --spotlight: #b8860b;
    --spotlight-tint: rgba(184, 134, 11, 0.12);
    --spotlight-tint-strong: rgba(184, 134, 11, 0.22);

    /* extra categorical hues for clears breakdown / >2 players */
    --c-blue: #2a78d6;
    --c-aqua: #1baf7a;
    --c-yellow: #eda100;
    --c-green: #008300;
    --c-violet: #4a3aa7;
    --c-red: #e34948;
    --c-magenta: #e87ba4;
    --c-orange: #eb6834;

    --grid-line: #e1e0d9;
    --shadow: 0 1px 2px rgba(18,20,28,0.04), 0 8px 24px rgba(18,20,28,0.06);

    --font-cjk: "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Heiti TC",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas,
      "Liberation Mono", monospace;

    --content-w: 920px;
    --wide-w: 1200px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0d13; --bg-raised: #141924; --bg-sunken: #10141d;
      --ink: #edeff7; --ink-secondary: #b7bcce; --muted: #6e7488;
      --border: rgba(255, 255, 255, 0.09); --border-strong: rgba(255, 255, 255, 0.17);
      --p1: #1caa9e; --p1-tint: rgba(28, 170, 158, 0.16); --p1-tint-strong: rgba(28, 170, 158, 0.28);
      --p2: #9678e8; --p2-tint: rgba(150, 120, 232, 0.18); --p2-tint-strong: rgba(150, 120, 232, 0.30);
      --good: #23c923; --good-tint: rgba(35, 201, 35, 0.16);
      --bad: #e66767; --bad-tint: rgba(230, 103, 103, 0.16);
      --pending: #fab219; --pending-tint: rgba(250, 178, 25, 0.16);
      --spotlight: #e8b94a; --spotlight-tint: rgba(232, 185, 74, 0.16); --spotlight-tint-strong: rgba(232, 185, 74, 0.26);
      --c-blue: #3987e5; --c-aqua: #199e70; --c-yellow: #c98500; --c-green: #008300;
      --c-violet: #9085e9; --c-red: #e66767; --c-magenta: #d55181; --c-orange: #d95926;
      --grid-line: #262b38;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0d13; --bg-raised: #141924; --bg-sunken: #10141d;
    --ink: #edeff7; --ink-secondary: #b7bcce; --muted: #6e7488;
    --border: rgba(255, 255, 255, 0.09); --border-strong: rgba(255, 255, 255, 0.17);
    --p1: #1caa9e; --p1-tint: rgba(28, 170, 158, 0.16); --p1-tint-strong: rgba(28, 170, 158, 0.28);
    --p2: #9678e8; --p2-tint: rgba(150, 120, 232, 0.18); --p2-tint-strong: rgba(150, 120, 232, 0.30);
    --good: #23c923; --good-tint: rgba(35, 201, 35, 0.16);
    --bad: #e66767; --bad-tint: rgba(230, 103, 103, 0.16);
    --pending: #fab219; --pending-tint: rgba(250, 178, 25, 0.16);
    --spotlight: #e8b94a; --spotlight-tint: rgba(232, 185, 74, 0.16); --spotlight-tint-strong: rgba(232, 185, 74, 0.26);
    --c-blue: #3987e5; --c-aqua: #199e70; --c-yellow: #c98500; --c-green: #008300;
    --c-violet: #9085e9; --c-red: #e66767; --c-magenta: #d55181; --c-orange: #d95926;
    --grid-line: #262b38;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --bg: #f5f6fa; --bg-raised: #ffffff; --bg-sunken: #eceef5;
    --ink: #12141c; --ink-secondary: #4b4f5e; --muted: #8a8fa3;
    --border: rgba(18, 20, 28, 0.10); --border-strong: rgba(18, 20, 28, 0.18);
    --p1: #0e8f9e; --p1-tint: rgba(14, 143, 158, 0.10); --p1-tint-strong: rgba(14, 143, 158, 0.20);
    --p2: #7c3aed; --p2-tint: rgba(124, 58, 237, 0.10); --p2-tint-strong: rgba(124, 58, 237, 0.20);
    --good: #0ca30c; --good-tint: rgba(12, 163, 12, 0.12);
    --bad: #d03b3b; --bad-tint: rgba(208, 59, 59, 0.12);
    --pending: #c98500; --pending-tint: rgba(201, 133, 0, 0.12);
    --spotlight: #b8860b; --spotlight-tint: rgba(184, 134, 11, 0.12); --spotlight-tint-strong: rgba(184, 134, 11, 0.22);
    --c-blue: #2a78d6; --c-aqua: #1baf7a; --c-yellow: #eda100; --c-green: #008300;
    --c-violet: #4a3aa7; --c-red: #e34948; --c-magenta: #e87ba4; --c-orange: #eb6834;
    --grid-line: #e1e0d9;
    --shadow: 0 1px 2px rgba(18,20,28,0.04), 0 8px 24px rgba(18,20,28,0.06);
  }

  /* ============================= RESET / BASE ============================= */
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-cjk);
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-family: var(--font-cjk); }
  p { margin: 0 0 1em; }
  p:last-child { margin-bottom: 0; }
  a { color: inherit; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--p2-tint-strong); }
  :focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  /* ============================= LAYOUT SHELL ============================= */
  .wrap { max-width: var(--content-w); margin: 0 auto; padding: 0 24px; }
  .wrap-wide { max-width: var(--wide-w); margin: 0 auto; padding: 0 24px; }
  section { padding: 56px 0; }
  section + section { border-top: 1px solid var(--border); }

  .eyebrow {
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 2px;
    background: linear-gradient(90deg, var(--p1), var(--p2));
    display: inline-block; border-radius: 2px;
  }
  .section-title { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800; letter-spacing: -0.01em; }
  .section-lede { color: var(--ink-secondary); font-size: 1.02rem; max-width: 64ch; margin-top: 12px; }

  /* ============================= TOP BAR ============================= */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 12px clamp(16px, 4vw, 40px);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.01em; }
  .brand .logo { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(135deg, var(--p1), var(--p2)); box-shadow: var(--shadow); }
  .brand small { font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; }
  .topbar .spacer { flex: 1; }
  .tbtn {
    font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.03em;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: var(--bg-raised); color: var(--ink); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px; transition: filter .15s, background .15s;
  }
  .tbtn:hover { filter: brightness(1.05); }
  .tbtn[disabled] { opacity: .4; cursor: not-allowed; }
  .tbtn.primary { background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; border-color: transparent; }
  @media (max-width: 520px) {
    .topbar { flex-wrap: wrap; padding: 10px 16px; gap: 8px; }
    .topbar .spacer { display: none; }
    .brand { flex: 1 1 auto; }
    .brand small { display: none; }
    .tbtn { padding: 7px 11px; font-size: 0.72rem; }
  }

  /* ============================= DROP ZONE / EMPTY ============================= */
  .stage { min-height: calc(100vh - 54px); display: flex; flex-direction: column; }
  .drop {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
    background:
      radial-gradient(ellipse 900px 420px at 18% -6%, var(--p1-tint), transparent 60%),
      radial-gradient(ellipse 900px 420px at 84% 4%, var(--p2-tint), transparent 60%);
  }
  .drop-card {
    max-width: 640px; width: 100%; text-align: center;
    border: 2px dashed var(--border-strong); border-radius: 24px;
    padding: clamp(32px, 6vw, 64px) clamp(20px, 5vw, 48px);
    background: color-mix(in srgb, var(--bg-raised) 55%, transparent);
    transition: border-color .18s, background .18s, transform .18s;
  }
  body.dragging .drop-card { border-color: var(--p1); background: var(--p1-tint); transform: scale(1.01); }
  .drop-tetro { display: flex; gap: 6px; justify-content: center; margin-bottom: 26px; }
  .drop-tetro i { width: 20px; height: 20px; border-radius: 4px; display: inline-block; box-shadow: var(--shadow); animation: bob 2.4s ease-in-out infinite; }
  .drop-tetro i:nth-child(1){ background: var(--c-blue); animation-delay: 0s;}
  .drop-tetro i:nth-child(2){ background: var(--c-violet); animation-delay: .12s;}
  .drop-tetro i:nth-child(3){ background: var(--c-aqua); animation-delay: .24s;}
  .drop-tetro i:nth-child(4){ background: var(--c-yellow); animation-delay: .36s;}
  .drop-tetro i:nth-child(5){ background: var(--c-red); animation-delay: .48s;}
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-7px);} }
  .drop-h { font-size: clamp(1.5rem, 3.6vw, 2.1rem); font-weight: 800; letter-spacing: -0.01em; margin-bottom: 12px; }
  .drop-sub { color: var(--ink-secondary); font-size: 1.02rem; margin: 0 auto 26px; max-width: 46ch; }
  .drop-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .file-label {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
    font-weight: 700; padding: 12px 22px; border-radius: 999px;
    background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff;
    box-shadow: var(--shadow); transition: filter .15s, transform .1s;
  }
  .file-label:hover { filter: brightness(1.06); }
  .file-label:active { transform: translateY(1px); }
  .file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .drop-hint { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); letter-spacing: 0.03em; }

  /* error chips */
  .errbar { max-width: var(--content-w); margin: 0 auto; padding: 0 24px; }
  .err-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 0 0; }
  .err-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem;
    padding: 8px 13px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--border-strong));
    background: var(--bad-tint); color: var(--bad); max-width: 100%;
  }
  .err-chip .fn { font-family: var(--font-mono); font-size: 0.78rem; word-break: break-all; }

  /* ============================= HERO / SCOREBOARD ============================= */
  .hero { padding: 44px 0 8px; }
  .hero-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .hero-title { font-size: clamp(1.7rem, 4vw, 2.7rem); font-weight: 800; letter-spacing: -0.015em; line-height: 1.25; max-width: 24ch; }
  .hero-title .h1c { color: var(--p1); }
  .hero-title .h2c { color: var(--p2); }

  .scoreboard {
    margin-top: 34px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 20px;
    padding: 26px clamp(16px, 4vw, 40px); box-shadow: var(--shadow);
  }
  .sb-player { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .sb-player.p-right { align-items: flex-end; text-align: right; }
  .sb-name { font-size: clamp(1.05rem, 2.4vw, 1.5rem); font-weight: 800; overflow-wrap: anywhere; }
  .sb-player.p-left .sb-name { color: var(--p1); }
  .sb-player.p-right .sb-name { color: var(--p2); }
  .sb-tag { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); letter-spacing: 0.05em; }
  .sb-mid { text-align: center; }
  .sb-score { font-family: var(--font-mono); font-weight: 800; font-size: clamp(2.2rem, 8vw, 4rem); letter-spacing: -0.02em; line-height: 1; }
  .sb-score .win1 { color: var(--p1); }
  .sb-score .win2 { color: var(--p2); }
  .sb-score .dash { color: var(--muted); margin: 0 .12em; }
  .sb-sub { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.04em; }

  /* stat cards */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 26px; }
  .stat-card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .stat-card .k { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
  .stat-card .v { font-family: var(--font-mono); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.01em; }
  .stat-card .d { font-size: 0.82rem; color: var(--ink-secondary); margin-top: 6px; }
  .stat-card.accent-1 { border-top: 3px solid var(--p1); }
  .stat-card.accent-2 { border-top: 3px solid var(--p2); }
  .stat-card.accent-g { border-top: 3px solid var(--spotlight); }

  /* ============================= MATCH CARDS ============================= */
  .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; margin-top: 8px; }
  .match-card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .mc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .mc-idx { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); letter-spacing: 0.06em; }
  .mc-win { font-weight: 800; font-size: 0.92rem; }
  .mc-win.w1 { color: var(--p1); } .mc-win.w2 { color: var(--p2); }
  .mc-score { font-family: var(--font-mono); font-weight: 800; font-size: 1.9rem; letter-spacing: -0.01em; }
  .mc-score .s1 { color: var(--p1); } .mc-score .s2 { color: var(--p2); } .mc-score .dash { color: var(--muted); }
  .pips { display: flex; flex-wrap: wrap; gap: 5px; }
  .pip { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .pip.p1 { background: var(--p1); } .pip.p2 { background: var(--p2); }
  .mc-note { font-size: 0.85rem; color: var(--ink-secondary); border-top: 1px dashed var(--border); padding-top: 10px; }
  .mc-note b { color: var(--ink); }

  /* ============================= CHARTS ============================= */
  .chart-panel { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 16px; padding: 20px 20px 16px; box-shadow: var(--shadow); margin-top: 18px; }
  .chart-panel h3 { font-size: 1.02rem; font-weight: 800; margin-bottom: 4px; }
  .chart-panel .cap { font-size: 0.85rem; color: var(--ink-secondary); margin-bottom: 12px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; font-size: 0.82rem; color: var(--ink-secondary); }
  .legend-row .lg { display: inline-flex; align-items: center; gap: 7px; }
  .legend-row .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
  svg { display: block; max-width: 100%; }
  svg text { font-family: var(--font-mono); fill: var(--muted); }
  .axis-line { stroke: var(--grid-line); stroke-width: 1; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; stroke-dasharray: 2 3; }
  .bar { transition: opacity .12s; }
  .bar:hover { opacity: .82; }
  .val-lbl { fill: var(--ink-secondary); font-weight: 700; }

  .charts-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

  /* tale of the tape */
  .tot { display: flex; flex-direction: column; gap: 2px; }
  .tot-row { display: grid; grid-template-columns: 1fr 128px 1fr; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .tot-row:last-child { border-bottom: 0; }
  .tot-val { font-family: var(--font-mono); font-weight: 800; font-size: 0.98rem; }
  .tot-val.l { text-align: right; } .tot-val.r { text-align: left; }
  .tot-val.win1 { color: var(--p1); } .tot-val.win2 { color: var(--p2); }
  .tot-lbl { text-align: center; font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.03em; }
  .tot-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 5px; align-items: center; }
  .tot-bar { height: 7px; border-radius: 4px; background: var(--bg-sunken); overflow: hidden; position: relative; }
  .tot-bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .tot-bar.l { transform: scaleX(-1); }
  .tot-bar.l .fill { background: var(--p1); left: 0; }
  .tot-bar.r .fill { background: var(--p2); left: 0; }

  /* ============================= SUPERLATIVES ============================= */
  .super-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .super-card { background: var(--bg-raised); border: 1px solid var(--border); border-left: 3px solid var(--spotlight); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .super-card .st { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--spotlight); margin-bottom: 8px; }
  .super-card .sv { font-size: 0.98rem; line-height: 1.6; }
  .super-card .sv b { font-weight: 800; }

  /* ============================= RECOMMENDATIONS ============================= */
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .rec-col { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
  .rec-col.for-1 { border-top: 3px solid var(--p1); }
  .rec-col.for-2 { border-top: 3px solid var(--p2); }
  .rec-col h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
  .rec-col.for-1 h3 { color: var(--p1); } .rec-col.for-2 h3 { color: var(--p2); }
  .rec-col .rc-sub { font-size: 0.84rem; color: var(--muted); font-family: var(--font-mono); margin-bottom: 16px; }
  .rec-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
  .rec-item { display: flex; gap: 12px; }
  .rec-num { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--bg-sunken); color: var(--ink-secondary); font-family: var(--font-mono); font-weight: 800; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; }
  .rec-item .txt { font-size: 0.94rem; line-height: 1.65; }
  .rec-item .txt b { font-weight: 800; }
  .rec-tag { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }

<script>
"use strict";
(function () {
  /* ============================================================
   *  PART 1 — PARSING & FACTS  (deep-equal to SCHEMA.md format)
   * ============================================================ */
  var CLEAR_KEYS = [
    ["singles","singles"],["doubles","doubles"],["triples","triples"],["quads","quads"],
    ["tspin_singles","tspinsingles"],["tspin_doubles","tspindoubles"],["tspin_triples","tspintriples"],
    ["mini_tspin_singles","minitspinsingles"],["mini_tspin_doubles","minitspindoubles"],["allclear","allclear"]
  ];

  function x1000(v) { var n = Number(v); return Number.isFinite(n) ? Math.floor(n * 1000 + 0.5) : 0; }
  function intVal(v) { var n = Number(v); return Number.isFinite(n) ? Math.trunc(n) : 0; }

  function extractGarbageEvents(events) {
    var out = [];
    if (!Array.isArray(events)) return out;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (!e || e.type !== "ige") continue;
      var data = e.data;
      if (!data || data.type !== "interaction_confirm") continue;
      var inner = data.data;
      if (!inner || inner.type !== "garbage") continue;
      out.push({ frame: intVal(data.frame), amt: intVal(inner.amt) });
    }
    return out;
  }

  function extractLeaderboardEntry(entry) {
    var s = (entry && entry.stats) || {};
    return {
      wins: intVal(entry && entry.wins),
      apm_x1000: x1000(s.apm), pps_x1000: x1000(s.pps), vs_x1000: x1000(s.vsscore),
      garbagesent: intVal(s.garbagesent), garbagereceived: intVal(s.garbagereceived), kills: intVal(s.kills)
    };
  }

  function extractRoundPlayer(p) {
    var s = (p && p.stats) || {};
    var rs = (p && p.replay && p.replay.results && p.replay.results.stats) || {};
    var cr = rs.clears || {};
    var gr = rs.garbage || {};
    var fr = rs.finesse || {};
    var clears = {};
    for (var i = 0; i < CLEAR_KEYS.length; i++) clears[CLEAR_KEYS[i][0]] = intVal(cr[CLEAR_KEYS[i][1]]);
    return {
      lifetime: intVal(p && p.lifetime),
      alive: (p && p.alive) === true,
      apm_x1000: x1000(s.apm), pps_x1000: x1000(s.pps), vs_x1000: x1000(s.vsscore),
      garbagesent: intVal(s.garbagesent), garbagereceived: intVal(s.garbagereceived), kills: intVal(s.kills),
      lines: intVal(rs.lines), pieces: intVal(rs.piecesplaced), inputs: intVal(rs.inputs), holds: intVal(rs.holds),
      topcombo: intVal(rs.topcombo), topbtb: intVal(rs.topbtb), tspins: intVal(rs.tspins),
      clears: clears,
      garbage_attack: intVal(gr.attack), garbage_cleared: intVal(gr.cleared), maxspike: intVal(gr.maxspike),
      finesse_faults: intVal(fr.faults), finesse_perfect: intVal(fr.perfectpieces),
      garbage_events: extractGarbageEvents(p && p.replay && p.replay.events)
    };
  }

  // Parse one replay into an intermediate match record. Throws on structural garbage.
  function parseOne(name, text) {
    var raw;
    try { raw = JSON.parse(text); }
    catch (e) { throw new Error("唔係有效 JSON,讀唔到(可能唔係 .ttrm 檔)"); }
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("唔係 replay 物件");
    var rp = raw.replay;
    if (!rp || !Array.isArray(rp.leaderboard)) throw new Error("搵唔到 replay.leaderboard");
    if (!Array.isArray(rp.rounds)) throw new Error("搵唔到 replay.rounds");

    var seen = [];        // usernames in first-appearance order (leaderboard then rounds)
    var leaderboard = {}; // username -> entry
    var score = {};
    for (var i = 0; i < rp.leaderboard.length; i++) {
      var e = rp.leaderboard[i];
      var u = e && e.username;
      if (typeof u !== "string") continue;
      if (seen.indexOf(u) < 0) seen.push(u);
      leaderboard[u] = extractLeaderboardEntry(e);
      score[u] = leaderboard[u].wins;
    }

    var rounds = rp.rounds.map(function (roundPlayers, ri) {
      if (!Array.isArray(roundPlayers)) throw new Error("round " + ri + " 唔係陣列");
      var players = {};
      var winner = "";
      var aliveCount = 0;
      for (var j = 0; j < roundPlayers.length; j++) {
        var pl = roundPlayers[j];
        var pu = pl && pl.username;
        if (typeof pu !== "string") throw new Error("round " + ri + " 有 player 冇 username");
        if (seen.indexOf(pu) < 0) seen.push(pu);
        players[pu] = extractRoundPlayer(pl);
        if (players[pu].alive) { winner = pu; aliveCount++; }
      }
      if (aliveCount !== 1 && !winner) {
        // fall back to the last-standing / lowest-death; keep deterministic
        winner = Object.keys(players)[0] || "";
      }
      return { index: ri, winner: winner, players: players };
    });

    if (typeof raw.ts !== "string") throw new Error("搵唔到 top-level ts");

    return { file: name, ts: raw.ts, _seen: seen, _score: score, leaderboard: leaderboard, rounds: rounds };
  }

  function derivePlayerOrder(records) {
    var order = [];
    for (var i = 0; i < records.length; i++) {
      var s = records[i]._seen;
      for (var j = 0; j < s.length; j++) if (order.indexOf(s[j]) < 0) order.push(s[j]);
    }
    return order;
  }

  function matchWinner(rec, playerOrder) {
    var best = "", bestWins = -Infinity, bestRank = Infinity;
    for (var u in rec._score) {
      if (!rec._score.hasOwnProperty(u)) continue;
      var w = rec._score[u];
      var rank = playerOrder.indexOf(u); if (rank < 0) rank = 999;
      if (w > bestWins || (w === bestWins && rank < bestRank)) { bestWins = w; best = u; bestRank = rank; }
    }
    return best;
  }

  // Build the canonical facts object (SCHEMA.md shape). items: [{name,text}].
  // Returns { facts, errors:[{file,error}] }.
  function buildFacts(items) {
    var records = [], errors = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var name = it && typeof it === "object" ? (it.name || it.file || ("match-" + (i + 1) + ".ttrm")) : ("match-" + (i + 1) + ".ttrm");
      var text = it && typeof it === "object" ? (it.text != null ? it.text : it.content) : it;
      try {
        records.push(parseOne(name, String(text)));
      } catch (err) {
        errors.push({ file: name, error: (err && err.message) ? err.message : String(err) });
      }
    }
    // sort by ts ascending (ties -> filename)
    records.sort(function (a, b) {
      if (a.ts < b.ts) return -1; if (a.ts > b.ts) return 1;
      return a.file < b.file ? -1 : a.file > b.file ? 1 : 0;
    });
    var playerOrder = derivePlayerOrder(records);

    var matches = records.map(function (rec, idx) {
      var winner = matchWinner(rec, playerOrder);
      var score = {};
      for (var k = 0; k < playerOrder.length; k++) {
        var u = playerOrder[k];
        if (rec._score.hasOwnProperty(u)) score[u] = rec._score[u];
      }
      // preserve any usernames not in global order (defensive)
      for (var u2 in rec._score) if (rec._score.hasOwnProperty(u2) && !score.hasOwnProperty(u2)) score[u2] = rec._score[u2];
      return {
        index: idx + 1, file: rec.file, ts: rec.ts, winner: winner,
        score: score, leaderboard: rec.leaderboard, rounds: rec.rounds
      };
    });

    return { facts: { players: playerOrder, matches: matches }, errors: errors };
  }

  /* ============================================================
   *  PART 2 — DERIVED METRICS  (pure functions over facts)
   * ============================================================ */
  function sum(arr) { var t = 0; for (var i = 0; i < arr.length; i++) t += arr[i]; return t; }
  function roundDuration(r) { var m = 0; for (var u in r.players) if (r.players.hasOwnProperty(u)) m = Math.max(m, r.players[u].lifetime); return m; }
  function queuedIncoming(pl) { var t = 0; for (var i = 0; i < pl.garbage_events.length; i++) t += pl.garbage_events[i].amt; return t; }
  function tspinClears(c) { return c.tspin_singles + c.tspin_doubles + c.tspin_triples + c.mini_tspin_singles + c.mini_tspin_doubles; }
  function allRounds(facts) { var out = []; facts.matches.forEach(function (m) { m.rounds.forEach(function (r) { out.push({ m: m, r: r }); }); }); return out; }

  var SPIKE_THRESHOLD = 12;

  function derive(facts) {
    var players = facts.players;
    var d = { players: players, perPlayer: {}, twoPlayer: players.length === 2 };
    // per-player accumulators
    players.forEach(function (p) {
      d.perPlayer[p] = {
        matchWins: 0, roundWins: 0, rounds: 0,
        pieces: 0, lines: 0, inputs: 0, holds: 0,
        finesse_faults: 0, finesse_perfect: 0,
        garbage_cleared: 0, garbage_attack: 0, garbagesent: 0, garbagereceived: 0,
        queuedIncoming: 0, lifetimeMs: 0,
        quads: 0, tspinClears: 0, allclear: 0, tspinsRaw: 0,
        maxSpikeCeiling: 0, spikeRounds: 0,
        topbtb: 0, topcombo: 0,
        clears: { singles: 0, doubles: 0, triples: 0, quads: 0, tspin_singles: 0, tspin_doubles: 0, tspin_triples: 0, mini_tspin_singles: 0, mini_tspin_doubles: 0, allclear: 0 }
      };
    });
    facts.matches.forEach(function (m) {
      if (d.perPlayer[m.winner]) d.perPlayer[m.winner].matchWins++;
      m.rounds.forEach(function (r) {
        for (var p in r.players) {
          if (!r.players.hasOwnProperty(p) || !d.perPlayer[p]) continue;
          var pl = r.players[p], a = d.perPlayer[p];
          a.rounds++;
          a.pieces += pl.pieces; a.lines += pl.lines; a.inputs += pl.inputs; a.holds += pl.holds;
          a.finesse_faults += pl.finesse_faults; a.finesse_perfect += pl.finesse_perfect;
          a.garbage_cleared += pl.garbage_cleared; a.garbage_attack += pl.garbage_attack;
          a.garbagesent += pl.garbagesent; a.garbagereceived += pl.garbagereceived;
          a.queuedIncoming += queuedIncoming(pl); a.lifetimeMs += pl.lifetime;
          a.quads += pl.clears.quads; a.tspinClears += tspinClears(pl.clears); a.allclear += pl.clears.allclear;
          a.tspinsRaw += pl.tspins;
          a.topbtb = Math.max(a.topbtb, pl.topbtb); a.topcombo = Math.max(a.topcombo, pl.topcombo);
          a.maxSpikeCeiling = Math.max(a.maxSpikeCeiling, pl.maxspike);
          if (pl.maxspike >= SPIKE_THRESHOLD) a.spikeRounds++;
          for (var ck in a.clears) if (a.clears.hasOwnProperty(ck)) a.clears[ck] += pl.clears[ck];
        }
        if (d.perPlayer[r.winner]) d.perPlayer[r.winner].roundWins++;
      });
    });
    // rates
    players.forEach(function (p) {
      var a = d.perPlayer[p];
      a.seconds = a.lifetimeMs / 1000;
      a.ppsAgg = a.seconds > 0 ? a.pieces / a.seconds : 0;                 // pieces per second (aggregate)
      a.faultRate = a.pieces > 0 ? a.finesse_faults / a.pieces : 0;         // faults per piece
      a.perfectRate = a.pieces > 0 ? a.finesse_perfect / a.pieces : 0;
      a.attackPerPiece = a.pieces > 0 ? a.garbage_attack / a.pieces : 0;
      a.tspinShare = (a.tspinClears + a.quads) > 0 ? a.tspinClears / (a.tspinClears + a.quads) : 0;
    });
    d.totalRounds = facts.matches.reduce(function (t, m) { return t + m.rounds.length; }, 0);
    d.totalMatches = facts.matches.length;

    // superlatives
    var rs = allRounds(facts);
    d.longest = null; d.shortest = null; d.maxSpike = { val: -1, hits: [] }; d.bestComeback = null; d.higherVsAlways = true; d.higherVsCount = 0;
    rs.forEach(function (x) {
      var dur = roundDuration(x.r);
      if (!d.longest || dur > d.longest.dur) d.longest = { m: x.m, r: x.r, dur: dur };
      if (!d.shortest || dur < d.shortest.dur) d.shortest = { m: x.m, r: x.r, dur: dur };
      for (var p in x.r.players) {
        if (!x.r.players.hasOwnProperty(p)) continue;
        var sp = x.r.players[p].maxspike;
        if (sp > d.maxSpike.val) { d.maxSpike.val = sp; d.maxSpike.hits = [{ m: x.m, r: x.r, p: p }]; }
        else if (sp === d.maxSpike.val) d.maxSpike.hits.push({ m: x.m, r: x.r, p: p });
      }
      // higher-vs-wins check (2-player)
      if (d.twoPlayer) {
        var w = x.r.winner, l = players[0] === w ? players[1] : players[0];
        if (x.r.players[w] && x.r.players[l]) {
          if (x.r.players[w].vs_x1000 > x.r.players[l].vs_x1000) d.higherVsCount++;
          else d.higherVsAlways = false;
          // comeback = winner queued MORE incoming than loser
          var deficit = queuedIncoming(x.r.players[w]) - queuedIncoming(x.r.players[l]);
          if (deficit > 0 && (!d.bestComeback || deficit > d.bestComeback.deficit)) {
            d.bestComeback = { m: x.m, r: x.r, winner: w, loser: l, deficit: deficit,
              winQ: queuedIncoming(x.r.players[w]), loseQ: queuedIncoming(x.r.players[l]) };
          }
        }
      }
    });

    // deciders: matches decided by exactly 1 round of margin (2-player)
    if (d.twoPlayer) {
      d.deciders = [];
      facts.matches.forEach(function (m) {
        var a = m.score[players[0]] || 0, b = m.score[players[1]] || 0;
        if (Math.abs(a - b) === 1) {
          var lastWinner = m.rounds.length ? m.rounds[m.rounds.length - 1].winner : "";
          d.deciders.push({ m: m, winner: m.winner, lastWinner: lastWinner });
        }
      });
      d.deciderWins = {}; players.forEach(function (p) { d.deciderWins[p] = 0; });
      d.deciders.forEach(function (x) { if (d.deciderWins[x.winner] != null) d.deciderWins[x.winner]++; });
    }
    return d;
  }

  /* ============================================================
   *  PART 3 — CLAIM ENGINE  (live predicates over facts)
   * ============================================================ */
  function ClaimBag(facts) {
    this.facts = facts; this.list = []; this._n = 0;
  }
  // register a claim; canto text embeds numbers, predicate re-derives from facts. returns id.
  ClaimBag.prototype.add = function (category, canto, gloss, predicate) {
    var id = "C" + String(++this._n).padStart(3, "0");
    this.list.push({ id: id, category: category, canto: canto, english_gloss: gloss, predicate: predicate, status: null });
    return id;
  };
  ClaimBag.prototype.evaluate = function () {
    var facts = this.facts, self = this;
    this.list.forEach(function (c) {
      var ok = false;
      try { ok = c.predicate(facts) === true; }
      catch (e) { ok = false; c._err = String(e); }
      c.status = ok ? "pass" : "fail";
      if (!ok) console.error("[claim FAIL] " + c.id + " — " + c.english_gloss + (c._err ? " (" + c._err + ")" : "") + " :: 「" + c.canto + "」");
    });
    return this;
  };

  /* ============================================================
   *  PART 4 — RENDERING HELPERS
   * ============================================================ */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function fmtInt(n) { return Number(n).toLocaleString("en-US"); }
  function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  function f2(x) { return (Math.round(x * 100) / 100).toFixed(2); }
  function pct(x) { return Math.round(x * 100); }
  function secs(ms) { return f1(ms / 1000); }

  // badge placeholder — expanded after claims evaluated
  function badge(id) { return '<a class="badge" data-claim="' + id + '" href="#claim-' + id + '"></a>'; }

  var CLAIM_MAP = {};
  function renderBadges(root) {
    (root || document).querySelectorAll(".badge[data-claim]").forEach(function (a) {
      var id = a.getAttribute("data-claim");
      var c = CLAIM_MAP[id];

    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var left = x + pad, top = y + pad;
    if (left + w > window.innerWidth - 8) left = x - w - pad;
    if (top + h > window.innerHeight - 8) top = y - h - pad;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { if (tip) tip.style.opacity = "0"; }
  function bindTip(node, html) {
    node.addEventListener("mousemove", function (e) { showTip(html, e.clientX, e.clientY); });
    node.addEventListener("mouseleave", hideTip);

  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) { var e = document.createElementNS(SVGNS, tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  // Grouped bar chart: one metric across matches, 2 series (players).
  // groups: [{label, values:[{name,color,value,disp}]}]
  function groupedBars(opts) {
    var groups = opts.groups, maxV = 0;
    groups.forEach(function (g) { g.values.forEach(function (v) { if (v.value > maxV) maxV = v.value; }); });
    if (maxV <= 0) maxV = 1;
    var W = Math.max(opts.minWidth || 0, groups.length * 62 + 46);
    var H = 210, padL = 40, padR = 12, padT = 14, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var gw = plotW / groups.length;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img" });
    // gridlines + y ticks
    var ticks = 4;
    for (var t = 0; t <= ticks; t++) {
      var yv = maxV * t / ticks, y = padT + plotH - (yv / maxV) * plotH;
      svg.appendChild(svgEl("line", { class: "grid-line", x1: padL, y1: y, x2: W - padR, y2: y }));
      var tl = svgEl("text", { x: padL - 6, y: y + 3, "text-anchor": "end", "font-size": "9" });
      tl.textContent = opts.tickFmt ? opts.tickFmt(yv) : String(Math.round(yv));
      svg.appendChild(tl);
    }
    groups.forEach(function (g, gi) {
      var series = g.values, n = series.length;
      var bw = Math.min(20, (gw - 12) / n);
      var groupInner = bw * n + (n - 1) * 4;
      var startX = padL + gi * gw + (gw - groupInner) / 2;
      series.forEach(function (v, si) {
        var bh = (v.value / maxV) * plotH;
        var x = startX + si * (bw + 4);
        var y = padT + plotH - bh;
        var rect = svgEl("rect", { class: "bar", x: x, y: y, width: bw, height: Math.max(0, bh), rx: 3, fill: v.color });
        bindTip(rect, "<b>" + esc(g.label) + "</b><br>" + esc(v.name) + " · " + esc(v.disp));
        svg.appendChild(rect);
      });
      var xl = svgEl("text", { x: padL + gi * gw + gw / 2, y: H - padB + 16, "text-anchor": "middle", "font-size": "9.5" });
      xl.textContent = g.label;
      svg.appendChild(xl);
    });
    svg.appendChild(svgEl("line", { class: "axis-line", x1: padL, y1: padT + plotH, x2: W - padR, y2: padT + plotH }));
    return svg;
  }

  /* ---------- recommendation rule engine ---------- */
  function recommendations(facts, d, bag, A, B) {

              var wR = t[worseP].fa / t[worseP].pc, bR = t[betterP].fa / t[betterP].pc;
              return f2(wR * 100) === wr && f2(bR * 100) === br && wR > bR;
            };
          })(worse, better, f2(wp.faultRate * 100), f2(bp.faultRate * 100)));
        recs[worse].push({ tag: "FINESSE DRILL", html: "<b>操 finesse。</b>你每粒方塊嘅 finesse 失誤率 " + f2(wp.faultRate * 100) + "%,比 " + esc(better) + " 嘅 " + f2(bp.faultRate * 100) + "% 高成 " + pct(gapRatio(pa.faultRate, pb.faultRate)) + "% " + badge(id) + "。日日行 finesse trainer,將多餘 input 減走,PPS 自然追返上。" });

    // RULE 2 — PPS gap > 5% -> slower player speeds up
    (function () {

        var slower = pa.ppsAgg < pb.ppsAgg ? A : B, faster = slower === A ? B : A;

        var id = bag.add("pace",
          esc(slower) + " 平均 " + f2(sp.ppsAgg) + " PPS,慢過 " + esc(faster) + " 嘅 " + f2(fp.ppsAgg) + " PPS 約 " + pct(gapRatio(pa.ppsAgg, pb.ppsAgg)) + "%",

      d.totalMatches + " matches, " + d.totalRounds + " rounds, " + facts.players.length + " players",
      function (f) { var tot = 0; f.matches.forEach(function (m) { tot += m.rounds.length; }); return tot === d.totalRounds && f.matches.length === d.totalMatches && f.players.length === facts.players.length; });
    var html = '<table class="leaderboard"><thead><tr><th>玩家</th><th>場數</th><th>局數</th><th>方塊</th><th>All Clear</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      html += '<tr><td class="pname" style="color:' + playerColorVar(i) + '">' + esc(r.p) + '</td><td>' + r.w + '</td><td>' + r.rw + '</td><td>' + fmtInt(r.pc) + '</td><td>' + r.ac + '</td></tr>';
    });
    html += '</tbody></table>';
    tblWrap.innerHTML = html;
    w.appendChild(el("p", "section-lede", "全表數據即場驗證 " + badge(idAgg)));
    w.appendChild(tblWrap);

    // per-match cards
    var mg = el("div", "match-grid"); mg.style.marginTop = "24px";
    facts.matches.forEach(function (m) {
      var card = el("div", "match-card");
      var scoreParts = facts.players.filter(function (p) { return (m.score[p] || 0) > 0 || m.leaderboard[p]; }).map(function (p) { return esc(p) + " " + (m.score[p] || 0); }).join(" · ");
      var pips = m.rounds.map(function (r) { var i = facts.players.indexOf(r.winner); return '<span class="pip" style="background:' + playerColorVar(i) + '" title="' + esc(r.winner) + '"></span>'; }).join("");
      card.innerHTML = '<div class="mc-head"><span class="mc-idx">第 ' + m.index + ' 場</span><span class="mc-win">' + esc(m.winner) + ' 贏</span></div>' +
        '<div style="font-family:var(--font-mono);font-size:.9rem">' + scoreParts + '</div><div class="pips">' + pips + '</div>';
      mg.appendChild(card);
    });
    w.appendChild(mg);
    hero.appendChild(w);
    root.appendChild(hero);
  }

  /* ---------- appendix + methodology ---------- */
  function buildAppendix(root, facts, bag) {
    var s = el("section");
    var w = el("div", "wrap-wide");
    w.innerHTML = '<div class="eyebrow">VERIFICATION</div><h2 class="section-title">即場驗證 · Claims Ledger</h2>' +
      '<p class="section-lede">上面每個可數嘅講法都對應一條 predicate,render 之前即場拎 parsed 數據再計一次。全部 ✓ 先叫過關。</p>' +
      '<div class="status-line" id="status-line"></div>' +
      '<div class="method-note"><b>方法論(要老實講):</b>呢版係<b>即場 JS 驗證</b>(runtime predicate re-evaluation),<b>唔係 Dafny 形式證明</b>。每條 claim 顯示嘅數字同佢個 predicate 由同一份 computed value 出,所以理論上唔會相反 — 若果邊條變 ✗,即係代碼有 bug(已經同步 console.error)。想要形式印章,禁上面「匯出 facts.json」再行離線嘅 Dafny pipeline(codegen_dafny.py)就得。</div>' +
      '<div class="table-wrap"><table class="appendix"><thead><tr><th>ID</th><th>類別</th><th>廣東話講法</th><th>English gloss</th><th>Predicate（source）</th><th>結果</th></tr></thead><tbody id="appendix-tbody"></tbody></table></div>';
    s.appendChild(w);
    root.appendChild(s);

    // footer
    var f = el("div", "report-footer");
    f.innerHTML = "全程喺 browser 度計 · 零外部請求 · " + facts.matches.length + " 個 replay · 生成時間 " + new Date().toISOString().slice(0, 19).replace("T", " ");
    root.appendChild(f);
  }

  function fillAppendixTable(claims) {
    var tbody = document.getElementById("appendix-tbody");
    if (!tbody) return;
    tbody.innerHTML = "";
    var pass = 0;
    claims.forEach(function (c) {
      if (c.status === "pass") pass++;
      var src = c.predicate.toString();
      if (src.length > 320) src = src.slice(0, 317) + "…";
      var tr = el("tr");
      tr.id = "claim-" + c.id;
      tr.innerHTML =
        '<td class="id-cell">' + c.id + '</td>' +
        '<td class="cat-cell">' + esc(c.category) + '</td>' +
        '<td>' + c.canto + '</td>' +
        '<td class="cat-cell">' + esc(c.english_gloss || "") + '</td>' +
        '<td class="src-cell"><code>' + esc(src) + '</code></td>' +
        '<td><span class="status-pill" data-status="' + c.status + '">' + (c.status === "pass" ? "✓ 通過" : "✗ 失敗") + '</span></td>';
      tbody.appendChild(tr);
    });
    var sl = document.getElementById("status-line");
    if (sl) {
      var all = pass === claims.length && claims.length > 0;
      sl.setAttribute("data-all", all ? "pass" : "fail");
      sl.innerHTML = all
        ? "✓ 全部 " + claims.length + " 條 claim 即場驗證通過。"
        : (pass + " / " + claims.length + " 條通過 — 有 ✗,睇 console.error 追 bug。");
    }
  }

  /* ============================================================
   *  PART 6 — FILE INTAKE + WIRING
   * ============================================================ */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList);
    if (!files.length) return;
    var items = [], errs = [], pending = files.length;
    files.forEach(function (file) {
      var name = file.name || "unnamed.ttrm";
      var isTtrm = /\.ttrm$/i.test(name) || /\.json$/i.test(name);
      var reader = new FileReader();
      reader.onload = function () { items.push({ name: name, text: String(reader.result), _ttrm: isTtrm }); done(); };
      reader.onerror = function () { errs.push({ file: name, error: "讀唔到個檔" }); done(); };
      reader.readAsText(file);
    });
    function done() {
      if (--pending > 0) return;
      // build facts from all items (parse errors captured inside buildFacts)
      var out = buildFacts(items);
      var allErrs = errs.concat(out.errors);
      if (!out.facts.matches.length) {
        showStageErrors(allErrs.length ? allErrs : [{ file: "(冇檔)", error: "冇一個 replay 讀得掂" }]);
        return;
      }
      renderReport(out.facts, allErrs);
      if (allErrs.length) appendReportErrors(allErrs);
    }
  }

  function showStageErrors(errs) {
    var box = document.getElementById("stage-errs");
    box.innerHTML = "";
    errs.forEach(function (e) { box.appendChild(errChip(e)); });
  }
  function appendReportErrors(errs) {
    var report = document.getElementById("report");
    var s = el("section");
    var w = el("div", "wrap-wide");
    w.innerHTML = '<div class="eyebrow">SKIPPED FILES</div><h2 class="section-title">跳咗嘅檔案</h2><p class="section-lede">呢啲檔讀唔掂或者唔係正常 replay,冇計入上面嘅報告。</p>';
    var chips = el("div", "err-chips");
    errs.forEach(function (e) { chips.appendChild(errChip(e)); });
    w.appendChild(chips); s.appendChild(w);
    report.insertBefore(s, report.querySelector("section:last-of-type") || null);
    // simpler: append at end before footer — insert before appendix section is fine
  }
  function errChip(e) {
    var c = el("div", "err-chip");
    c.innerHTML = '<span aria-hidden="true">⚠</span><span class="fn">' + esc(e.file) + '</span><span>' + esc(e.error) + '</span>';
    return c;
  }

  // export facts.json in SCHEMA order
  function orderedFacts(facts) {
    return {
      players: facts.players,
      matches: facts.matches.map(function (m) {
        var lb = {}; Object.keys(m.leaderboard).forEach(function (u) {
          var e = m.leaderboard[u];
          lb[u] = { wins: e.wins, apm_x1000: e.apm_x1000, pps_x1000: e.pps_x1000, vs_x1000: e.vs_x1000, garbagesent: e.garbagesent, garbagereceived: e.garbagereceived, kills: e.kills };
        });
        return {
          index: m.index, file: m.file, ts: m.ts, winner: m.winner, score: m.score,
          leaderboard: lb,
          rounds: m.rounds.map(function (r) {
            var players = {};
            Object.keys(r.players).forEach(function (u) {
              var p = r.players[u];
              players[u] = {
                lifetime: p.lifetime, alive: p.alive, apm_x1000: p.apm_x1000, pps_x1000: p.pps_x1000, vs_x1000: p.vs_x1000,
                garbagesent: p.garbagesent, garbagereceived: p.garbagereceived, kills: p.kills,
                lines: p.lines, pieces: p.pieces, inputs: p.inputs, holds: p.holds,
                topcombo: p.topcombo, topbtb: p.topbtb, tspins: p.tspins,
                clears: p.clears,
                garbage_attack: p.garbage_attack, garbage_cleared: p.garbage_cleared, maxspike: p.maxspike,
                finesse_faults: p.finesse_faults, finesse_perfect: p.finesse_perfect,
                garbage_events: p.garbage_events
              };
            });
            return { index: r.index, winner: r.winner, players: players };
          })
        };
      })
    };
  }
  function exportFacts() {
    if (!lastFacts) return;
    var blob = new Blob([JSON.stringify(orderedFacts(lastFacts), null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "facts.json"; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function resetSession() {
    document.body.classList.remove("has-data");
    document.getElementById("report").innerHTML = "";
    document.getElementById("stage-errs").innerHTML = "";
    document.getElementById("file-input").value = "";
    document.getElementById("export-btn").disabled = true;
    document.getElementById("reset-btn").hidden = true;
    lastFacts = lastDerived = lastClaims = null; lastErrors = []; CLAIM_MAP = {};
    window.scrollTo(0, 0);
  }

  // theme toggle
  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme");
    var next;
    if (cur === "dark") next = "light"; else if (cur === "light") next = "dark";
    else next = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
  }

  function wire() {
    var fi = document.getElementById("file-input");
    fi.addEventListener("change", function () { readFiles(fi.files); });
    document.getElementById("export-btn").addEventListener("click", exportFacts);
    document.getElementById("reset-btn").addEventListener("click", resetSession);
    document.getElementById("theme-btn").addEventListener("click", toggleTheme);

    var dragDepth = 0;
    window.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
    window.addEventListener("dragover", function (e) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
    window.addEventListener("dragleave", function (e) { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
    window.addEventListener("drop", function (e) {
      e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
    });
  }

  /* ============================================================
   *  PART 7 — TESTABILITY HOOKS
   * ============================================================ */
  // window.__analyze(items) — items: array of JSON strings OR {name,text} objects.
  // Runs the full pipeline programmatically and returns the computed facts object.
  window.__analyze = function (items) {
    if (!Array.isArray(items)) throw new Error("__analyze expects an array");
    var out = buildFacts(items);
    // build + evaluate claims so __claims() works even without rendering
    var d = derive(out.facts);
    var bag = new ClaimBag(out.facts);
    if (out.facts.players.length === 2) {
      // reproduce the same claim set the report builds (headless)
      buildClaimsHeadless(out.facts, d, bag);
    } else {
      // minimal aggregate claim
      bag.add("score", "aggregate", "aggregate", function (f) { return f.matches.length === out.facts.matches.length; });
    }
    bag.evaluate();
    lastFacts = out.facts; lastDerived = d; lastClaims = bag.list;
    CLAIM_MAP = {}; bag.list.forEach(function (c) { CLAIM_MAP[c.id] = c; });
    return orderedFacts(out.facts);
  };
  // window.__claims() — fired claims with pass/fail (from the last render or __analyze).
  window.__claims = function () {
    if (!lastClaims) return [];
    return lastClaims.map(function (c) {
      var ok; try { ok = c.predicate(lastFacts) === true; } catch (e) { ok = false; }
      return { id: c.id, category: c.category, canto: c.canto, english_gloss: c.english_gloss, source: c.predicate.toString(), pass: ok };
    });
  };
  window.__facts = function () { return lastFacts ? orderedFacts(lastFacts) : null; };

  // Headless claim builder — mirrors the countable claims used in the DOM report,
  // so __claims() is meaningful without touching the DOM. (The DOM path registers
  // the same predicates via the render functions; this covers the __analyze path.)
  function buildClaimsHeadless(facts, d, bag) {
    var A = facts.players[0], B = facts.players[1], pa = d.perPlayer[A], pb = d.perPlayer[B];
    bag.add("score", A + " won " + pa.matchWins, A + " matches " + pa.matchWins, function (f) {
      return f.matches.filter(function (m) { return m.winner === A; }).length === pa.matchWins && f.matches.filter(function (m) { return m.winner === B; }).length === pb.matchWins;
    });
    bag.add("score", "rounds", "rounds", function (f) {
      var tot = 0, aw = 0, bw = 0; f.matches.forEach(function (m) { tot += m.rounds.length; m.rounds.forEach(function (r) { if (r.winner === A) aw++; else if (r.winner === B) bw++; }); });
      return tot === d.totalRounds && aw === pa.roundWins && bw === pb.roundWins;
    });
    supLong(bag, d, A, B); supShort(bag, d, A, B);
    // spike
    bag.add("spike", "maxspike", "maxspike", function (f) {
      var mx = -1; f.matches.forEach(function (m) { m.rounds.forEach(function (r) { for (var p in r.players) mx = Math.max(mx, r.players[p].maxspike); }); });
      return mx === d.maxSpike.val;
    });
    // higher vs
    bag.add("clutch", "higher-vs", "higher-vs", function (f) {
      var cnt = 0, tot = 0; f.matches.forEach(function (m) { m.rounds.forEach(function (r) { tot++; var w = r.winner, l = f.players[0] === w ? f.players[1] : f.players[0]; if (r.players[w] && r.players[l] && r.players[w].vs_x1000 > r.players[l].vs_x1000) cnt++; }); });
      return cnt === d.higherVsCount && tot === d.totalRounds;
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>
